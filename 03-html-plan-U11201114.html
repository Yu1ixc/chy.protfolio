<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小社團整理活動準備頁｜活動 03</title>
</head>
<body>
  <h1>小社團整理活動準備頁</h1>

  <p>
    這一頁用來整理社團活動需要準備的材料、步驟與小組分工。
  </p>

  <h2>要帶的材料</h2>
  <ul>
    <li>A4 紙 3 張</li>
    <li>膠帶 1 卷</li>
    <li>粗吸管 10 個</li>
  </ul>

  <h2>活動步驟</h2>
  <ol>
    <li>先確認材料是否準備齊全。</li>
    <li>依照活動目標討論小組做法。</li>
    <li>分工完成製作與整理。</li>
    <li>活動結束後一起收拾材料。</li>
  </ol>

  <h2>小組任務分工</h2>

  <table border="1">
    <caption>小組任務分工表</caption>

    <thead>
      <tr>
        <th scope="col">分組</th>
        <th scope="col">工作內容</th>
        <th scope="col">最後成果</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>設計組</td>
        <td>討論活動構想並畫出草圖</td>
        <td>完成一份設計草圖</td>
      </tr>
      <tr>
        <td>製作組</td>
        <td>依照草圖完成材料組裝</td>
        <td>完成活動作品</td>
      </tr>
      <tr>
        <td>記錄組</td>
        <td>記錄製作過程與重要發現</td>
        <td>完成一份活動紀錄</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
