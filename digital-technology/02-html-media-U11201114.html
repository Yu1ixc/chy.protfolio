<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>自然觀察任務卡｜活動 02</title>

</head>


<body>


  <h1>校園自然觀察任務卡</h1>


  <p>
    今天我們一起走進校園，
    用眼睛、耳朵和鏡頭記錄身邊的自然。
  </p>



  <h2>任務一：觀察葉子</h2>

  <p>
    找一片你覺得有趣的葉子，
    仔細觀察它的形狀、顏色與葉脈。
  </p>

  <img
    src="media-02/leaf-photo.png"
    width="240"
    alt="一片綠色葉子的觀察照片"
  >



  <h2>任務二：觀察花朵</h2>

  <p>
    看看照片中的花朵，
    觀察花瓣的形狀、顏色與周圍環境。
  </p>

  <img
    src="media-02/flower-photo.png"
    width="300"
    alt="校園中的花朵照片"
  >



  <h2>任務三：比較不同圖片</h2>

  <p>
    下面是去除背景後的花朵圖片，
    可以和原本的照片比較看看有什麼不同。
  </p>

  <img
    src="media-02/flower-transparent.png"
    width="240"
    alt="去除背景後的花朵圖片"
  >



  <h2>任務四：聽聽校園</h2>

  <p>
    播放下面的聲音，
    聽聽看你能不能發現校園裡的環境聲音。
  </p>

  <audio
    src="media-02/notice.wav"
    controls
  ></audio>



  <h2>任務五：觀看自然影片</h2>

  <p>
    看看下面的影片，
    留意花朵的外觀以及周圍環境。
  </p>

  <video
    src="media-02/flower.mp4"
    controls
    width="400"
  ></video>



  <h2>觀察記錄</h2>

  <p>
    完成觀察後，
    可以利用下面的任務圖示提醒自己整理觀察紀錄。
  </p>

  <img
    src="media-02/captain-calendar.svg"
    width="700"
    alt="自然觀察任務紀錄圖示"
  >


</body>

</html>
