<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園自然觀察任務卡</title>
</head>
<body>

  <h1>校園自然觀察任務卡</h1>
  <p>今天我們用眼睛觀察，也用文字記錄發現。</p>

  <h2>任務一：看看葉脈</h2>
  <p>觀察葉片圖片，找出葉脈延伸的方向。</p>
  <img src="media-02/leaf-photo.png"
       width="240"
       alt="綠色葉片與葉脈的近拍照片">

  <h2>任務二：準備開始</h2>
  <p>按下播放，聽到三個由低到高的短音後，開始你的觀察。</p>
  <audio src="media-02/notice.wav" controls>
    你的瀏覽器不支援音訊播放。
  </audio>

  <h2>任務三：觀察花朵</h2>
  <p>播放短片，看看花朵怎麼移動，再用一句話描述。</p>
  <video src="media-02/flower.mp4" width="300" controls>
    你的瀏覽器不支援影片播放。
  </video>
  <p>短片呈現花朵在畫面中的移動情形。</p>

  <h2>透明圖片</h2>
  <p>下面是一張透明背景的花朵圖片。</p>
  <img src="media-02/flower-transparent.png"
       width="240"
       alt="透明背景的花朵圖片">

  <h2>船長的一週行事</h2>
  <img src="media-02/captain-calendar.svg"
       width="700"
       alt="船長的一週行事圖">

  <p>
    星期一：整理甲板<br>
    星期二：檢查船帆<br>
    星期三：觀察海面<br>
    星期四：記錄航行<br>
    星期五：整理航海日誌
  </p>

  <h2>素材來源</h2>
  <p>本頁圖片、音訊、影片與 SVG 使用課堂提供的 media-02 素材。</p>

</body>
</html>
