<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放學後社團體驗報名表｜活動 04</title>
</head>
<body>
  <h1>放學後社團體驗報名表</h1>

  <p>
    這是練習用表單，資料不會送出或儲存，
    不代表正式完成報名。
  </p>

  <form>

    <p>
      <label for="nickname">我的暱稱：</label>
      <input
        type="text"
        id="nickname"
        name="nickname"
        placeholder="例如：小悠"
      >
    </p>

    <p>
      <label for="club">想體驗的社團：</label>

      <select id="club" name="club">
        <option value="">請選擇一個社團</option>
        <option value="story">故事劇場</option>
        <option value="science">科學手作</option>
        <option value="art">藝術創作</option>
      </select>
    </p>

    <fieldset>
      <legend>方便參加的日子</legend>

      <p>
        <label>
          <input type="radio" name="session" value="tuesday">
          星期二
        </label>
      </p>

      <p>
        <label>
          <input type="radio" name="session" value="thursday">
          星期四
        </label>
      </p>

      <p>
        <label>
          <input type="radio" name="session" value="friday">
          星期五
        </label>
      </p>
    </fieldset>

    <fieldset>
      <legend>我期待的活動方式</legend>

      <p>
        <label>
          <input type="checkbox" name="skills" value="handmade">
          動手製作
        </label>
      </p>

      <p>
        <label>
          <input type="checkbox" name="skills" value="teamwork">
          和同學合作
        </label>
      </p>

      <p>
        <label>
          <input type="checkbox" name="skills" value="sharing">
          上台分享
        </label>
      </p>
    </fieldset>

    <p>
      <label for="message">想告訴老師的事：</label>
    </p>

    <p>
      <textarea
        id="message"
        name="message"
        rows="5"
        cols="32"
        placeholder="例如：我希望能和同學一起完成一個小作品"
      ></textarea>
    </p>

    <p>
      <button type="button" disabled>
        練習版：尚未開放報名
      </button>
    </p>

  </form>
</body>
</html>
