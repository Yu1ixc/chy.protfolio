<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水與生活｜活動 01</title>
</head>
<body>
  <h1>水與生活：小小科學探索</h1>

  <p>一起從生活中的水，發現科學的有趣之處。</p>

  <h2>活動介紹</h2>
  <p>
    這次活動適合國小中年級學生，
    我們會從日常生活中的水開始觀察，
    認識水在生活中的不同用途與特性。
  </p>

  <h3>觀察水的樣子</h3>
  <p>
    看看不同容器中的水，
    試著說出它們有哪些相同與不同的地方。
  </p>

  <h3>認識水的化學符號</h3>
  <p>水的化學式是 H<sub>2</sub>O。</p>

  <h3>簡單的面積紀錄</h3>
  <p>
    如果我們記錄一小塊觀察區域，
    可以用 cm<sup>2</sup> 表示面積。
  </p>

  <h2>參加活動的小提醒</h2>
  <p>
    請仔細觀察、<b>勇敢提出問題</b>，
    也可以把自己的想法寫下來。
    科學探索不一定只有一個答案，
    <i>好奇心就是最好的開始。</i>
  </p>
</body>
</html>
